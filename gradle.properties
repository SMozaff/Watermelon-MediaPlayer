android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
kotlin.code.style=official
# The Kotlin compile daemon is a separate JVM process from the Gradle daemon above and
# doesn't inherit org.gradle.jvmargs. Without an explicit heap size it can take its own
# large default allocation, which on memory-constrained CI runners (e.g. GitHub-hosted,
# ~7GB total) can starve alongside the 4g Gradle daemon and get silently OOM-killed --
# this is the real cause of "daemon has terminated unexpectedly... error code: 0" seen in
# CI, not a source-code issue. Giving it an explicit, smaller heap avoids the contention.
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC
