name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0
      - name: Build
        run: |
          set +e
          ./gradlew :ui-presentation:compileDebugKotlin --no-daemon > compile-debug-kotlin.log 2>&1
          status=$?
          set -e
          cat compile-debug-kotlin.log
          exit $status
      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compile-debug-kotlin-log
          path: compile-debug-kotlin.log
          if-no-files-found: warn
      - name: Lint
        run: |
          set +e
          ./gradlew lint --no-daemon > lint.log 2>&1
          status=$?
          set -e
          cat lint.log
          exit $status
      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-log
          path: lint.log
          if-no-files-found: warn
