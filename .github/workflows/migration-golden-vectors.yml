name: Migration golden vectors

# Verifies the frozen oracle after the Rust-only cutover. The ten JSON files were generated
# from the Kotlin implementations before those implementations were deleted (DD-12), so the
# "generator":"kotlin" provenance field is historical and correct. This workflow deliberately
# does not regenerate the corpus: doing so from Rust would make parity a Rust-vs-Rust check and
# destroy the D-3 evidence. Regeneration needs a new owner decision and a fresh independent oracle.

on:
  pull_request:
    paths:
      - "testdata/golden/**"
      - ".github/workflows/migration-golden-vectors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-oracle:
    name: Verify frozen oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify corpus inventory
        run: |
          count=$(find testdata/golden -maxdepth 1 -name '*.json' | wc -l)
          echo "corpus_files=$count"
          test "$count" -eq 10

      - name: Verify committed checksums
        working-directory: testdata/golden
        run: sha256sum -c SHA256SUMS

      - name: Verify corpus size
        run: |
          bytes=$(du -sb testdata/golden | cut -f1)
          echo "corpus_bytes=$bytes"
          test "$bytes" -lt 5242880

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Structural self-check
        env:
          JAVA_TOOL_OPTIONS: -Dwatermelon.goldenDir=${{ github.workspace }}/testdata/golden
        run: |
          ./gradlew :subtitle-engine:testDebugUnitTest --tests '*SubtitleGoldenVectorSelfCheckTest' --no-daemon --rerun --stacktrace
          ./gradlew :media-tools:testDebugUnitTest --tests '*SpeechAccumulatorGoldenVectorSelfCheckTest' --no-daemon --rerun --stacktrace
