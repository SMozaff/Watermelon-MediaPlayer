name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Code scanning requires only repository contents and permission to upload findings.
permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin and Java
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted runners already provide the Android command-line tools. Install only the
      # compile SDK required by this project rather than invoking a broader setup action that
      # attempted to resolve an unrelated emulator archive in a prior main-branch scan.
      - name: Install required Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "Android sdkmanager was not found."; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: java-kotlin
          build-mode: manual

      # Build after CodeQL initialization so Kotlin/Java compilation is observed.
      # This workflow never receives release-signing credentials.
      - name: Build Android sources for analysis
        run: ./gradlew :app:assembleDebug --no-daemon --dependency-verification=strict --stacktrace

      - name: Analyze source
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: "/language:java-kotlin"
