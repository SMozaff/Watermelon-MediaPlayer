name: Dependency Integrity

on:
  pull_request:
    paths:
      - "**/*.gradle"
      - "**/*.gradle.kts"
      - "gradle/**"
      - "settings.gradle.kts"
      - ".github/workflows/dependency-integrity.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

# The job resolves and compiles dependencies but never needs repository write access
# or release-signing credentials.
permissions:
  contents: read

jobs:
  clean-resolution:
    name: Clean Gradle resolution and MP3 compile gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      # Do not restore a Gradle dependency cache in this job. Removing module caches
      # forces fresh artifact resolution, including the JitPack java-lame dependency.
      - name: Remove dependency caches
        run: rm -rf "$HOME/.gradle/caches"

      # Build the app to resolve its shipped dependency graph, then exercise the resolved
      # java-lame API with a deterministic synthetic PCM fixture that emits an MPEG audio frame.
      - name: Resolve dependencies and run the MP3 compile-time gate
        run: |
          ./gradlew --no-daemon --refresh-dependencies \
            --dependency-verification=strict \
            :app:assembleDebug \
            :media-tools:testDebugUnitTest \
            --tests com.watermelon.mediatools.engine.Mp3EncoderTest \
            --stacktrace
      # Generate an SPDX JSON SBOM from the exact artifacts freshly resolved above. The
      # download sub-action is immutable-pinned; it has no release-publishing permissions.
      - name: Download Syft for SBOM generation
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Generate dependency SBOM
        run: |
          mkdir -p release-artifacts
          "${{ steps.syft.outputs.cmd }}" \
            scan dir:"$HOME/.gradle/caches/modules-2/files-2.1" \
            --output spdx-json > release-artifacts/dependency-sbom.spdx.json
          test -s release-artifacts/dependency-sbom.spdx.json
      - name: Upload MP3 test report and SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-integrity-evidence
          path: |
            media-tools/build/reports/tests/testDebugUnitTest/
            release-artifacts/dependency-sbom.spdx.json
          if-no-files-found: warn
          retention-days: 14
