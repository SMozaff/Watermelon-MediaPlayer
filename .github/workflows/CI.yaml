name: build-judge

# Quality gates referenced in README.md:
#   - full Android build
#   - unit tests
#   - benchmarks module compiles
#   - migration-ladder gate (library-storage's androidTest, MigrationTest.kt)
#   - verify_interfaces.py — every interface in common-interfaces has an *Impl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only needs repository contents. Release signing is deliberately isolated
# from this pull-request and push workflow.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interfaces:
    name: Verify interfaces have implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run verify_interfaces.py
        run: python3 scripts/verify_interfaces.py

  build-and-unit-test:
    name: Build (all modules) + unit tests
    runs-on: ubuntu-latest
    needs: interfaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Full Android build across every module (requires dl.google.com for
      # AGP/AndroidX/Compose/Media3 — see README's note on restricted-network
      # environments where only :common-interfaces builds).
      - name: Build all modules
        run: ./gradlew build --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Debug APK — automatically signed with AGP's debug keystore. Release-signing
      # credentials are intentionally not available to this pull-request/push workflow.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 14

      # Gradle's console output only prints the FIRST lint error/warning even when many
      # are found ("Lint found 8 errors, 1 warnings. First failure: ..."), which made a
      # real CI failure hard to fully diagnose from console logs alone. Uploading the full
      # HTML/XML reports means all findings are visible after any lint failure, not just
      # the first one.
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results*'
          retention-days: 14

  migration-ladder:
    name: Migration-ladder gate (library-storage androidTest)
    runs-on: ubuntu-latest
    needs: interfaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM (for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Zero-data-loss SQLite migrations (PlaybackPositions / SubtitleOffsets
      # never dropped) — see README, "Zero-data-loss SQLite migrations".
      - name: Run MigrationTest on emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :library-storage:connectedAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.watermelon.storage.db.MigrationTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-ladder-reports
          path: 'library-storage/build/reports/androidTests/'
          retention-days: 14

  benchmarks-compile:
    name: Benchmarks module compiles
    runs-on: ubuntu-latest
    needs: interfaces
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # benchmarks is a com.android.test module with a custom "benchmark"
      # build type (not "debug" — androidComponents.beforeVariants disables
      # every variant except "benchmark"), so assembleDebug does not exist.
      - name: Assemble benchmarks
        run: ./gradlew :benchmarks:assembleBenchmark --stacktrace
