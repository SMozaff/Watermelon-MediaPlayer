name: build-judge

# Quality gates referenced in README.md:
#   - debug Android application graph builds
#   - unit tests
#   - benchmarks module compiles
#   - migration-ladder gate (all library-storage androidTests, including V1→V12)
#   - player runtime regression gate (all ui-presentation androidTests, including A1–A4)
#   - verify_interfaces.py — every interface in common-interfaces has an *Impl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interfaces:
    name: Verify interfaces have implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run verify_interfaces.py
        run: python3 scripts/verify_interfaces.py

      - name: Verify AGP 9 built-in Kotlin configuration
        run: python3 scripts/verify_agp9_builtin_kotlin.py

  build-and-unit-test:
    name: Debug build + unit tests
    runs-on: ubuntu-latest
    needs: interfaces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Current product decision: validate the debug application graph only.
      # :app:assembleDebug transitively compiles every production module used by the app;
      # benchmarks remain a separate gate below because com.android.test owns its own variant.
      - name: Assemble debug application graph
        run: ./gradlew :app:assembleDebug --stacktrace

      # Keep unit coverage debug-scoped as well; do not invoke aggregate `test`/`build` tasks
      # that also configure or execute release variants.
      - name: Run debug unit tests
        run: |
          ./gradlew \
            :common-interfaces:test \
            :playback-engine:testDebugUnitTest \
            :library-storage:testDebugUnitTest \
            :subtitle-engine:testDebugUnitTest \
            :media-tools:testDebugUnitTest \
            :ui-presentation:testDebugUnitTest \
            :app:testDebugUnitTest \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 14

      # Gradle's console output only prints the FIRST lint error/warning even when many
      # are found ("Lint found 8 errors, 1 warnings. First failure: ..."), which made a
      # real CI failure hard to fully diagnose from console logs alone. Uploading the full
      # HTML/XML reports means all findings are visible after any lint failure, not just
      # the first one.
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: '**/build/reports/lint-results*'
          retention-days: 14

  migration-ladder:
    name: Migration ladder V1-V12 + idempotency gate
    runs-on: ubuntu-latest
    needs: interfaces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM (for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Required Phase B gate. Run the whole module's instrumentation suite so the
      # original MigrationTest and ExtendedMigrationLadderTest (V1/V5/V6/V10/V11/V12
      # upgrade paths + step idempotency + data preservation) cannot silently fall out
      # of CI when new migration regression tests are added.
      - name: Run all library-storage migration tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :library-storage:connectedAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-ladder-reports
          path: 'library-storage/build/reports/androidTests/'
          retention-days: 14

  ui-instrumentation:
    name: Player A1-A4 runtime regression gate
    runs-on: ubuntu-latest
    needs: interfaces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM (for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Required Phase A gate. Run the complete ui-presentation instrumentation
      # suite: scaffold + PlayerUiStatePreservationTest (A1) +
      # PlayerScreenStatePreservationTest (A2/A3/A4). Running the module rather than an
      # individual class makes future player-state regressions automatically part of CI.
      - name: Run all player runtime regression tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :ui-presentation:connectedAndroidTest --stacktrace

      - name: Upload ui instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-instrumentation-reports
          path: 'ui-presentation/build/reports/androidTests/'
          retention-days: 14

  benchmarks-compile:
    name: Benchmarks module compiles
    runs-on: ubuntu-latest
    needs: interfaces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # benchmarks is a com.android.test module with a custom "benchmark"
      # build type (not "debug" — androidComponents.beforeVariants disables
      # every variant except "benchmark"), so assembleDebug does not exist.
      - name: Assemble benchmarks
        run: ./gradlew :benchmarks:assembleBenchmark --stacktrace
