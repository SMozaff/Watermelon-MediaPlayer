name: build-judge

# Quality gates referenced in README.md:
#   - full Android build
#   - unit tests
#   - benchmarks module compiles
#   - migration-ladder gate (library-storage's androidTest, MigrationTest.kt)
#   - verify_interfaces.py — every interface in common-interfaces has an *Impl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interfaces:
    name: Verify interfaces have implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run verify_interfaces.py
        run: python3 scripts/verify_interfaces.py

  build-and-unit-test:
    name: Build (all modules) + unit tests
    runs-on: ubuntu-latest
    needs: interfaces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Full Android build across every module (requires dl.google.com for
      # AGP/AndroidX/Compose/Media3 — see README's note on restricted-network
      # environments where only :common-interfaces builds).
      - name: Build all modules
        run: ./gradlew build --stacktrace

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      # Debug APK — auto-signed with AGP's default debug keystore, no
      # signingConfig needed. app/build.gradle.kts has no release signing
      # config yet, so only debug is built here.
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Proves the release build type (signingConfigs + buildTypes.release added in
      # app/build.gradle.kts) is structurally wired and buildable. No signing secrets are
      # provisioned here -- RELEASE_STORE_FILE/RELEASE_STORE_PASSWORD/RELEASE_KEY_ALIAS/
      # RELEASE_KEY_PASSWORD are intentionally absent from CI, so this produces an
      # UNSIGNED-IN-CI artifact (or fails at the signing step) until a human provisions
      # real release-signing secrets. That provisioning is a separate, deliberate follow-up
      # -- not something to fake here with throwaway credentials.
      # app/build.gradle.kts only attaches signingConfigs.release when all four RELEASE_*
      # Gradle properties are present; none are defined in this repo, so this produces a
      # normal *unsigned* release APK (app-release-unsigned.apk) rather than failing. Once a
      # human provisions RELEASE_STORE_FILE/RELEASE_STORE_PASSWORD/RELEASE_KEY_ALIAS/
      # RELEASE_KEY_PASSWORD as repo/environment secrets and passes them via -P flags here,
      # this step will produce a real signed artifact instead.
      - name: Assemble release APK (unsigned in CI -- no signing secrets provisioned yet)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/'
          retention-days: 14

      # Gradle's console output only prints the FIRST lint error/warning even when many
      # are found ("Lint found 8 errors, 1 warnings. First failure: ..."), which made a
      # real CI failure hard to fully diagnose from console logs alone. Uploading the full
      # HTML/XML reports means all findings are visible after any lint failure, not just
      # the first one.
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results*'
          retention-days: 14

  migration-ladder:
    name: Migration-ladder gate (library-storage androidTest)
    runs-on: ubuntu-latest
    needs: interfaces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM (for emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Zero-data-loss SQLite migrations (PlaybackPositions / SubtitleOffsets
      # never dropped) — see README, "Zero-data-loss SQLite migrations".
      - name: Run MigrationTest on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :library-storage:connectedAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.watermelon.storage.db.MigrationTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-ladder-reports
          path: 'library-storage/build/reports/androidTests/'
          retention-days: 14

  benchmarks-compile:
    name: Benchmarks module compiles
    runs-on: ubuntu-latest
    needs: interfaces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # benchmarks is a com.android.test module with a custom "benchmark"
      # build type (not "debug" — androidComponents.beforeVariants disables
      # every variant except "benchmark"), so assembleDebug does not exist.
      - name: Assemble benchmarks
        run: ./gradlew :benchmarks:assembleBenchmark --stacktrace